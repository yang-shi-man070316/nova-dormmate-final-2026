<html>
<head>
<meta charset="utf-8">
<title>宿舍环境统计报告</title>
<style>
*{
    box-sizing: border-box;
}
body{
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 20px;
    font-family: system-ui, -apple-system, sans-serif;
    background-color: #f7f9fc;
}
.container{
    background: #ffffff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
h1, h2{
    text-align: center;
    color: #2c3e50;
}
p{
    line-height: 1.6;
    color: #333;
}
table.dataframe {
  border-collapse: collapse;
  margin: 16px auto 32px;
  width: 90%;
}
table.dataframe th, table.dataframe td {
  border:1px solid #d1d9e6;
  padding:10px 8px;
  text-align:center;
}
table.dataframe th {
    background-color:#34495e;
    color:white;
    font-weight:500;
}
table.dataframe tr:nth-child(even){
    background-color:#f4f7fb;
}
img{
    display:block;
    margin:12px auto 24px;
    border-radius:6px;
}
</style>
</head>
<body>
<div class="container">
    <h1>宿舍环境监测统计报告</h1>
    <p>总记录数：5</p>
    <p>平均温度：21.20 ℃</p>
    <p>最高温度：34.00 ℃，最低温度：11.00 ℃</p>
    <p>平均湿度：18.60 %</p>
    <p>最高湿度：25.00 %，最低湿度：9.00 %</p>

    <h2>需要关注的记录</h2>
    <table border="1" class="dataframe">
      <thead>
        <tr>
          <th>time</th>
          <th>temperature</th>
          <th>humidity</th>
          <th>status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>2026-09-26T12:07:23.442Z</td>
          <td>34</td>
          <td>25</td>
          <td>偏热</td>
        </tr>
      </tbody>
    </table>

    <h2>环境状态统计柱状图</h2>
    <img src="chart.png" width="600">

    <h2>温湿度趋势折线图</h2>
    <img src="trend.png" width="700">

    <!-- ========== A4 事件复盘表格 ========== -->
    <h2>事件复盘（A4）</h2>
    <table border="1" class="dataframe">
      <thead>
        <tr>
          <th>宿舍编号</th>
          <th>异常开始时间</th>
          <th>异常问题</th>
          <th>优先原因</th>
          <th>处理动作</th>
          <th>操作时间</th>
          <th>恢复时间</th>
          <th>最终结果</th>
        </tr>
      </thead>
      <tbody id="eventTbody">
      </tbody>
    </table>
</div>

<script>
// 读取A2页面保存到localStorage的事件记录
function renderEventTable(){
    const records = JSON.parse(localStorage.getItem("eventRecords") || "[]");
    const tbody = document.getElementById("eventTbody");
    tbody.innerHTML = "";
    if(records.length === 0){
        const tr = document.createElement("tr");
        tr.innerHTML = "<td colspan='8'>暂无闭环事件记录，请在A2页面完成一次完整异常处理流程</td>";
        tbody.appendChild(tr);
        return;
    }
    records.forEach(item=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${item.dormId}</td>
            <td>${item.startTime}</td>
            <td>${item.abnormalProblem}</td>
            <td>${item.priorityReason}</td>
            <td>${item.actionText}</td>
            <td>${item.actionTime}</td>
            <td>${item.recoverTime}</td>
            <td>${item.finalResult}</td>
        `;
        tbody.appendChild(tr);
    })
}
// 页面加载完成渲染
window.onload = function(){
    renderEventTable();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>A2 宿舍设备处理面板</title>
    <style>
        *{box-sizing:border-box;font-family:system-ui,sans-serif;}
        body{padding:20px;margin:0;background:#f5f7fa;}
        h1{text-align:center;color:#222;}
        .state-box{background:#fff;padding:16px;border-radius:8px;margin-bottom:16px;box-shadow:0 1px 3px #0000001a;}
        .mode-buttons button{padding:8px 14px;margin:4px;border:none;border-radius:4px;background:#4088dd;color:white;font-size:14px;cursor:pointer;}
        .mode-buttons button.active{
            background:#165DFF !important;
            box-shadow:0 0 0 2px #80b8ff;
        }
        table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px #0000001a;margin-bottom:16px;}
        th,td{padding:12px;text-align:center;}
        th{background:#2c3e50;color:#fff;}
        tr:nth-child(even){background:#fafafa;}
        button{padding:6px 10px;margin:2px;border:none;border-radius:4px;color:#fff;cursor:pointer;font-size:13px;}
        .btn-fan{background:#e74c3c;}
        .btn-light{background:#e74c3c;}
        .btn-dehumid{background:#e74c3c;}
        /* =====新增绿色按钮样式===== */
        .btn-fan-on{background:#27ae60;}
        .btn-light-on{background:#27ae60;}
        .btn-dehumid-on{background:#27ae60;}
        .log-area{background:#fff;padding:16px;border-radius:8px;box-shadow:0 1px 3px #0000001a;min-height:180px;}
        /* A3事件状态文字颜色 */
        .status-idle{color:#666;}
        .status-handling{color:#ff9900;font-weight:bold;}
        .status-recovered{color:#00aa44;font-weight:bold;}
        /* ========= A4新增复盘面板样式 ========= */
        .event-panel{background:#fff;padding:16px;border-radius:8px;box-shadow:0 1px 3px #0000001a;margin-top:16px;}
        .event-item{border-bottom:1px solid #eee;padding:10px 0;}
    </style>
</head>
<body>
    <h1>宿舍设备处理面板</h1>

    <div class="state-box">
        <div>等待异常事件</div>
        <div style="margin:6px 0;">事件状态: 等待</div>
        <div class="mode-buttons">
            <button id="btnStudy">学习模式</button>
            <button id="btnSleep">睡眠模式</button>
            <button id="btnAway">离寝模式</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>宿舍</th>
                <th>状态</th>
                <th>温度</th>
                <th>湿度</th>
                <th>事件状态</th>
                <th>设备控制</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- 表格内容JS渲染 -->
        </tbody>
    </table>

    <div class="log-area">
        <h3>事件日志</h3>
        <div id="logBox"></div>
    </div>

    <!-- ========= A4新增：事件复盘记录面板 ========= -->
    <div class="event-panel">
        <h3>事件复盘记录</h3>
        <div id="eventBox"></div>
    </div>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
// 初始化宿舍状态，新增processStatus：idle空闲 / handling处理中 / recovered已恢复
const dormStatusData = {
    "dorm-a": {
        fan: false,
        light: false,
        dehumidifier: false,
        status: "正常",
        temp: 25,
        hum: 60,
        mode:"study",
        processStatus:"idle"
    },
    "dorm-b": {
        fan: false,
        light: false,
        dehumidifier: false,
        status: "正常",
        temp: 25,
        hum: 60,
        mode:"study",
        processStatus:"idle"
    },
    "dorm-c": {
        fan: false,
        light: false,
        dehumidifier: false,
        status: "正常",
        temp: 25,
        hum: 60,
        mode:"study",
        processStatus:"idle"
    }
};
// 当前选中用来切换模式的宿舍
let selectedDorm = "dorm-a";

// ===================== A4 新增全局事件存储 =====================
let eventList = [];

// 获取当前宿舍正在进行的事件（一个宿舍同一时间只能有1个未结束事件）
function getActiveEvent(dormId) {
    return eventList.find(ev => ev.dorm === dormId && ev.endTime === null);
}

// 创建新事件记录
function createNewEvent(dormId, abnormalMsg) {
    const newEvent = {
        dorm: dormId,
        startTime: new Date().toLocaleString(),
        abnormalInfo: abnormalMsg,
        priorityReason: "连续异常时长更长，优先处理",
        actionList: [],
        actionTimeList: [],
        endTime: null,
        finalResult: ""
    };
    eventList.push(newEvent);
    renderEventPanel();
    return newEvent;
}

// 【A4核心】把完整闭环事件保存到localStorage，供report.html读取
function saveEventToLocalStorage(finishEvent){
    // 读取已有记录
    let savedRecords = JSON.parse(localStorage.getItem("eventRecords") || "[]");
    // 组装老师要求的7个字段
    const storeItem = {
        dormId: finishEvent.dorm,
        startTime: finishEvent.startTime,
        abnormalProblem: finishEvent.abnormalInfo,
        priorityReason: finishEvent.priorityReason,
        actionText: finishEvent.actionList.join("；"),
        actionTime: finishEvent.actionTimeList.join("；"),
        recoverTime: finishEvent.endTime,
        finalResult: finishEvent.finalResult
    }
    savedRecords.push(storeItem);
    localStorage.setItem("eventRecords", JSON.stringify(savedRecords));
}

// 渲染A4复盘面板
function renderEventPanel() {
    const box = document.getElementById("eventBox");
    box.innerHTML = "";
    if (eventList.length === 0) {
        box.innerHTML = "<div>暂无事件记录，等待异常事件触发</div>";
        return;
    }
    eventList.forEach(ev => {
        const div = document.createElement("div");
        div.className = "event-item";
        const actionText = ev.actionList.length > 0 ? ev.actionList.join("；") : "无";
        const actionTimeText = ev.actionTimeList.length > 0 ? ev.actionTimeList.join("；") : "无";
        div.innerHTML = `
            <div><strong>宿舍：${ev.dorm}</strong></div>
            <div>开始时间：${ev.startTime}</div>
            <div>异常信息：${ev.abnormalInfo}</div>
            <div>优先原因：${ev.priorityReason}</div>
            <div>处理动作：${actionText}</div>
            <div>动作时间：${actionTimeText}</div>
            <div>恢复时间：${ev.endTime ?? "仍在处理中"}</div>
            <div>最终结果：${ev.finalResult ?? "等待数据验证"}</div>
        `;
        box.appendChild(div);
    })
}
// ==============================================================

// MQTT客户端
const client = mqtt.connect('ws://127.0.0.1:8083/mqtt');
client.on('connect', ()=>{
    console.log("A2 MQTT连接成功");
    client.subscribe('dormmate/+/env');
    client.subscribe('dormmate/mode');
})

// A3核心函数：收到新环境数据，自动判断是否恢复
function checkRecover(dormId, newTemp, newHum){
    const dorm = dormStatusData[dormId];
    // 只有处于【处理中】状态才执行判断
    if(dorm.processStatus !== "handling") return;

    // 正常区间：温度22~28℃，湿度40~70%RH
    const isNormal = (newTemp >= 22 && newTemp <= 28) && (newHum >= 40 && newHum <=70);
    if(isNormal){
        dorm.processStatus = "recovered";
        dorm.status = "正常";
        addLog(`${new Date().toLocaleTimeString()} | ${dormId} | 监测到数据恢复正常，事件结束`);
        // ========= A4：事件标记结束，写入恢复结果并持久化存储 =========
        const ev = getActiveEvent(dormId);
        if(ev){
            ev.endTime = new Date().toLocaleString();
            ev.finalResult = "环境指标恢复正常，事件闭环";
            // 保存到localStorage，给report读取
            saveEventToLocalStorage(ev);
            renderEventPanel();
        }
    }else{
        addLog(`${new Date().toLocaleTimeString()} | ${dormId} | 数据仍异常，继续监测`);
    }
}

// 接收环境数据
client.on('message', function(topic, payload){
    try{
        let msg = JSON.parse(payload.toString());
        const dorm = dormStatusData[msg.nodeId];
        if(dorm){
            dorm.status = msg.status;
            dorm.temp = msg.temp;
            dorm.hum = msg.hum;
            // A3：收到新数据，调用恢复判断
            checkRecover(msg.nodeId, msg.temp, msg.hum);
            // ========= A4：检测到异常，新建事件 =========
            if(msg.status !== "正常" && dorm.processStatus === "idle" && !getActiveEvent(msg.nodeId)){
                createNewEvent(msg.nodeId, msg.status);
            }
            renderTable();
            renderEventPanel();
        }
    }catch(e){
        console.error(e);
    }
})

// 渲染表格
function renderTable(){
    const tb = document.getElementById("tableBody");
    tb.innerHTML = "";
    for(let id in dormStatusData){
        const d = dormStatusData[id];
        // 状态文字和class
        let statusText, statusClass;
        if(d.processStatus === "idle"){
            statusText = "空闲"; statusClass = "status-idle";
        }else if(d.processStatus === "handling"){
            statusText = "处理中"; statusClass = "status-handling";
        }else{
            statusText = "已恢复"; statusClass = "status-recovered";
        }
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${id}</td>
            <td>${d.status}</td>
            <td>${d.temp} ℃</td>
            <td>${d.hum} %RH</td>
            <td><span class="${statusClass}">${statusText}</span></td>
            <td>
                <button class="${d.fan ? 'btn-fan-on' : 'btn-fan'}" onclick="fanControl('${id}')">风扇</button>
                <button class="${d.light ? 'btn-light-on' : 'btn-light'}" onclick="lightControl('${id}')">灯</button>
                <button class="${d.dehumidifier ? 'btn-dehumid-on' : 'btn-dehumid'}" onclick="dehumidControl('${id}')">除湿</button>
                <button onclick="selectOperateDorm('${id}')" style="background:#3498db;">选择操作</button>
            </td>
        `
        tb.appendChild(tr);
    }
}

// 选中要操作模式的宿舍
function selectOperateDorm(dormId){
    selectedDorm = dormId;
    document.getElementById("currentDormShow").innerText = dormId;
    refreshModeButtonUI();
}

// 模式按钮事件
document.getElementById("btnStudy").onclick = function(){
    dormStatusData[selectedDorm].mode = "study";
    client.publish("dormmate/mode", JSON.stringify({
        nodeId: selectedDorm,
        mode:"study"
    }));
    addLog(`${new Date().toLocaleTimeString()} | ${selectedDorm} | 切换【学习模式】`);
    refreshModeButtonUI();
}
document.getElementById("btnSleep").onclick = function(){
    dormStatusData[selectedDorm].mode = "sleep";
    client.publish("dormmate/mode", JSON.stringify({
        nodeId: selectedDorm,
        mode:"sleep"
    }));
    addLog(`${new Date().toLocaleTimeString()} | ${selectedDorm} | 切换【睡眠模式】`);
    refreshModeButtonUI();
}
document.getElementById("btnAway").onclick = function(){
    const dorm = dormStatusData[selectedDorm];
    dorm.mode = "away";
    //离寝模式，自动关闭全部设备
    dorm.fan = false;
    dorm.light = false;
    dorm.dehumidifier = false;
    client.publish("dormmate/control", JSON.stringify({nodeId:selectedDorm, device:"fan", state:false}));
    client.publish("dormmate/control", JSON.stringify({nodeId:selectedDorm, device:"light", state:false}));
    client.publish("dormmate/control", JSON.stringify({nodeId:selectedDorm, device:"dehumidifier", state:false}));
    client.publish("dormmate/mode", JSON.stringify({
        nodeId: selectedDorm,
        mode:"away"
    }));
    addLog(`${new Date().toLocaleTimeString()} | ${selectedDorm} | 切换【离寝模式】，自动关闭全部设备`);
    refreshModeButtonUI();
    renderTable();
}

// 更新模式按钮高亮
function refreshModeButtonUI(){
    document.querySelectorAll(".mode-buttons button").forEach(btn=>btn.classList.remove("active"));
    const m = dormStatusData[selectedDorm].mode;
    if(m === "study") document.getElementById("btnStudy").classList.add("active");
    if(m === "sleep") document.getElementById("btnSleep").classList.add("active");
    if(m === "away") document.getElementById("btnAway").classList.add("active");
}

// 风扇控制
function fanControl(dormId){
    const dorm = dormStatusData[dormId];
    dorm.fan = !dorm.fan;
    client.publish("dormmate/control", JSON.stringify({
        nodeId:dormId,
        device:"fan",
        state:dorm.fan
    }));
    const text = dorm.fan ? "开启风扇" : "关闭风扇";
    addLog(`${new Date().toLocaleTimeString()} | ${dormId} | ${text}`);
    // A3：开启设备 → 标记为处理中；关闭设备不触发事件
    if(dorm.fan){
        dorm.processStatus = "handling";
        addLog(`${new Date().toLocaleTimeString()} | ${dormId} | 进入【处理中】，等待新数据验证恢复`);
        // A4：把本次操作存入事件记录，附带操作时间
        const ev = getActiveEvent(dormId);
        if(ev) {
            ev.actionList.push("开启风扇");
            ev.actionTimeList.push(new Date().toLocaleString());
        }
        renderEventPanel();
    }
    renderTable();
}
// 灯控制
function lightControl(dormId){
    const dorm = dormStatusData[dormId];
    dorm.light = !dorm.light;
    client.publish("dormmate/control", JSON.stringify({
        nodeId:dormId,
        device:"light",
        state:dorm.light
    }));
    const text = dorm.light ? "开启灯" : "关闭灯";
    addLog(`${new Date().toLocaleTimeString()} | ${dormId} | ${text}`);
    if(dorm.light){
        dorm.processStatus = "handling";
        addLog(`${new Date().toLocaleTimeString()} | ${dormId} | 进入【处理中】，等待新数据验证恢复`);
        // A4：记录动作+时间
        const ev = getActiveEvent(dormId);
        if(ev) {
            ev.actionList.push("开启灯光");
            ev.actionTimeList.push(new Date().toLocaleString());
        }
        renderEventPanel();
    }
    renderTable();
}
// 除湿控制
function dehumidControl(dormId){
    const dorm = dormStatusData[dormId];
    dorm.dehumidifier = !dorm.dehumidifier;
    client.publish("dormmate/control", JSON.stringify({
        nodeId:dormId,
        device:"dehumidifier",
        state:dorm.dehumidifier
    }));
    const text = dorm.dehumidifier ? "开启除湿" : "关闭除湿";
    addLog(`${new Date().toLocaleTimeString()} | ${dormId} | ${text}`);
    if(dorm.dehumidifier){
        dorm.processStatus = "handling";
        addLog(`${new Date().toLocaleTimeString()} | ${dormId} | 进入【处理中】，等待新数据验证恢复`);
        // A4：记录动作+时间
        const ev = getActiveEvent(dormId);
        if(ev) {
            ev.actionList.push("开启除湿器");
            ev.actionTimeList.push(new Date().toLocaleString());
        }
        renderEventPanel();
    }
    renderTable();
}

// 添加日志
function addLog(text){
    const logBox = document.getElementById("logBox");
    const div = document.createElement("div");
    div.innerText = text;
    logBox.appendChild(div);
}

// 页面初始化
window.onload = function(){
    renderTable();
    selectOperateDorm("dorm-a");
    renderEventPanel();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>DormMate</title>
    <!-- 引入外部css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>DormMate</h1>

        <div class="line-item">
            温度：<input type="text" id="tempInput" placeholder="输入温度">℃
        </div>
        <div class="line-item">
            湿度：<input type="text" id="humInput" placeholder="输入湿度"> %
        </div>

        <div class="action-row">
            <button id="analyseBtn">分析环境</button>
            <span class="status-box" id="statusText">当前状态</span>
        </div>
        <div class="line-item">
            <span id="adviceText"></span>
        </div>

        <div class="action-row">
            <button onclick="exportCSV()">导出CSV</button>
        </div>

        <h3>历史记录</h3>
        <div id="historyList"></div>

        <hr>
        <h3>摄像头模块</h3>
        <video id="video" autoplay playsinline width="400"></video>
        <canvas id="canvas" style="display:none;"></canvas>
        <div class="action-row">
            <button id="openCamBtn">打开摄像头</button>
            <button id="takePhotoBtn">拍照保存快照</button>
        </div>

        <hr>
        <h3>语音交互模块</h3>
        <div class="action-row">
            <button id="ttsBtn">朗读当前状态</button>
            <button id="startAsrBtn">开始语音识别</button>
        </div>
        <div class="line-item">
            识别结果：<span id="asrResultText"></span>
        </div>
    </div>

    <!-- 引入js文件 -->
    <script src="script.js"></script>
</body>
</html>

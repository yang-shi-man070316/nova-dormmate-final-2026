<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>DormMate 宿舍环境分析</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>DormMate 宿舍环境分析</h1>
        <div class="input-area">
            <div>
                <label>温度：</label>
                <input type="text" id="tempInput" placeholder="输入温度">
                <span>℃</span>
            </div>
            <div>
                <label>湿度：</label>
                <input type="text" id="humInput" placeholder="输入湿度">
                <span>%</span>
            </div>
            <button id="analyseBtn">分析环境</button>
        </div>

        <div class="result-area">
            <h3>当前状态：<span id="statusText"></span></h3>
            <p>建议：<span id="adviceText"></span></p>
        </div>

        <div class="history-area">
            <h3>历史记录</h3>
            <div id="historyList"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

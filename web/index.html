<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>DormMate</title>
    <!-- 引入外部css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>DormMate</h1>

        <div class="line-item">
            温度：<input type="text" id="tempInput" placeholder="输入温度">℃
        </div>
        <div class="line-item">
            湿度：<input type="text" id="humInput" placeholder="输入湿度"> %
        </div>

        <div class="action-row">
            <button id="analyseBtn">分析环境</button>
            <span class="status-box" id="statusText">当前状态</span>
        </div>

        <!-- ========== M3 本机交互模块 ========== -->
<div class="card" style="margin-top:20px;">
    <h2>本机交互</h2>
    <!-- Camera 摄像头拍照 -->
    <div>
        <h3>摄像头快照</h3>
        <video id="video" width="320" height="240" autoplay playsinline  muted style="border:1px solid #ccc;"></video>
        <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>
        <br>
        <button id="openCameraBtn">打开摄像头</button>
        <button id="takePhotoBtn">拍照保存快照</button>
    </div>

    <!-- ASR语音识别 + TTS语音朗读 -->
    <div style="margin-top:20px;">
        <h3>语音交互</h3>
        <button id="startAsrBtn">开始语音识别</button>
        <p>识别结果：<span id="asrResultText"></span></p>
        <button id="ttsReadBtn">朗读当前状态</button>
    </div>
</div>

        <div style="font-size:18px;margin:10px 0;">
            建议：<span id="adviceText"></span>
        </div>

        <h3>历史记录</h3>
        <div id="historyList"></div>
        <button id="exportCsvBtn">导出CSV</button>
    </div>

    <!-- 引入外部js -->
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DormMate M6 3D宿舍+监控面板+A1</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@4.3.7/dist/mqtt.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}
body{
    padding:20px;
    background:#f7f9fc;
    max-width:1450px;
    margin:0 auto;
}
/* 顶部状态栏 */
.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
    gap:12px;
}
.connect-status{
    font-size:17px;
    font-weight:bold;
    white-space:nowrap;
}
.warn-box{
    background:#ff4444;
    color:#fff;
    padding:8px 16px;
    border-radius:6px;
    font-weight:bold;
    white-space:nowrap;
    display:none;
}
/* 主体左右布局 */
.main-wrap{
    display:flex;
    gap:24px;
    align-items:flex-start;
}
/* 左侧3D场景，自动占剩余全部宽度 */
#scene-box{
    flex:1;
    height:580px;
    border:1px solid #dbe4ee;
    background:#ffffff;
    border-radius:12px;
    box-shadow:0 12px 34px rgba(31,58,95,0.12);
}
/* 右侧卡片固定宽度，不压缩 */
.right-card{
    width:340px;
    flex-shrink:0;
    background:#ffffff;
    border-radius:12px;
    padding:20px;
    box-shadow:0 4px 12px #00000015;
}
.right-card h3{margin-bottom:14px;color:#223;}
.dorm-btn-group{display:flex;gap:8px;margin-bottom:16px;}
.dorm-btn{padding:6px 10px;border:none;border-radius:5px;background:#4472C4;color:white;font-size:14px;cursor:pointer;}
.dorm-btn:hover{background:#365ba3;}
.dorm-info{line-height:2.2;font-size:15px;}
/* A1底部面板 */
#a1-panel{
    margin-top:20px;
    padding:16px;
    border:1px solid #4472C4;
    border-radius:10px;
    background:#f8faff;
    width:100%;
}
#a1-panel h3{margin:0 0 8px 0;color:#224488;}
#priorityText{font-size:16px;}
</style>
</head>
<body>
<!-- 顶部 -->
<div class="top-bar">
    <div class="connect-status">MQTT: <span id="mqttState">未连接</span> | 当前宿舍：<span id="dormName">--</span> | 状态：<span id="dormStatus">--</span></div>
    <div id="warnBox" class="warn-box">⚠️ 环境超标，请留意！</div>
</div>

<!-- 主体：左边3D，右边卡片 -->
<div class="main-wrap">
    <div id="scene-box"></div>
    <div class="right-card">
        <h3>宿舍环境监控</h3>
        <div class="dorm-btn-group">
            <button type="button" class="dorm-btn" data-dorm="dorm-a">宿舍A</button>
            <button type="button" class="dorm-btn" data-dorm="dorm-b">宿舍B</button>
            <button type="button" class="dorm-btn" data-dorm="dorm-c">宿舍C</button>
        </div>
        <div class="dorm-info">
            <div>🌡 当前温度：<span id="tempVal">--</span> ℃</div>
            <div>💧 当前湿度：<span id="humVal">--</span> %RH</div>
            <div>✅ 舒适度：<span id="comfortVal">--</span></div>
            <div>🌀 除湿机：<span id="dehumidVal">--</span></div>
            <div>📊 最高温：<span id="maxTemp">--</span> ℃</div>
            <div>📊 最低温：<span id="minTemp">--</span> ℃</div>
            <div>📊 最高湿：<span id="maxHum">--</span> %RH</div>
            <div>📊 最低湿：<span id="minHum">--</span> %RH</div>
        </div>
    </div>
</div>

<!-- A1优先关注面板 -->
<div id="a1-panel">
    <h3>A1｜当前优先关注宿舍</h3>
    <div id="priorityText">等待数据计算优先级...</div>
</div>

<script>
// ========= A4新增：全局事件日志与事件添加工具函数 =========
window.globalEventLog = [];
function addEvent(dormId, eventType, content, reason="", action="", result=""){
  const now = new Date();
  const timeStr = `${now.getHours()}:${now.getMinutes().toString().padStart(2,"0")}`;
  window.globalEventLog.push({
    timestamp: timeStr,
    dormId: dormId,
    eventType: eventType,
    content: content,
    reason: reason,
    action: action,
    result: result
  });
  console.log("【A4事件】新增事件", window.globalEventLog);
}
// =========================================================

let scene, camera, renderer;
let fanMesh, windowMesh;
let fanRotateSpeed = 0;
let floorMesh;
let dehumidifierMesh; //除湿机模型
let ambientLight; //全局环境光（用于模式切换）

// 全局存储每个宿舍数据，新增max/min极值 + 设备状态 fan light dehumidifier + mode模式
const dormStatusData = {
    "dorm-a": { continuousErrTime:0, errCount:0, isAbnormal:false, timer:null, temp:0, hum:0, status:"正常", maxTemp:null, minTemp:null, maxHum:null, minHum:null, fan:false, light:false, dehumidifier:false, mode:"study" },
    "dorm-b": { continuousErrTime:0, errCount:0, isAbnormal:false, timer:null, temp:0, hum:0, status:"正常", maxTemp:null, minTemp:null, maxHum:null, minHum:null, fan:false, light:false, dehumidifier:false, mode:"study" },
    "dorm-c": { continuousErrTime:0, errCount:0, isAbnormal:false, timer:null, temp:0, hum:0, status:"正常", maxTemp:null, minTemp:null, maxHum:null, minHum:null, fan:false, light:false, dehumidifier:false, mode:"study" }
};
// 当前选中查看的宿舍（点击按钮切换）
let currentViewDorm = "dorm-a";

// 初始化按钮点击事件（DOM加载完成后绑定！）
function bindDormButtons(){
    document.querySelectorAll('.dorm-btn').forEach(btn=>{
        btn.addEventListener('click', function(){
            const dormId = this.dataset.dorm;
            currentViewDorm = dormId;
            // 读取该宿舍保存的数据，刷新3D画面+全部面板（包含极值）
            const d = dormStatusData[dormId];
            // ✅切换宿舍时，加载这个宿舍自己的风扇状态
            fanRotateSpeed = d.fan ? 0.08 : 0;
            updateScene(dormId, d.status, d.temp, d.hum, d.maxTemp, d.minTemp, d.maxHum, d.minHum);
            updateLightByMode(d.mode);
            updateDehumidVisual(d.dehumidifier);
        })
    })
}

function init3DScene() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xfff7ea);
    camera = new THREE.PerspectiveCamera(40, 1200 / 580, 0.1, 1000);
    camera.position.set(10, 6, 11);
    camera.lookAt(0, 1, 0);
    renderer = new THREE.WebGLRenderer({antialias:true});
    const container = document.getElementById("scene-box");
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
    dirLight.position.set(6, 9, 5);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(1024, 1024);
    dirLight.shadow.camera.left = -12;
    dirLight.shadow.camera.right = 12;
    dirLight.shadow.camera.top = 12;
    dirLight.shadow.camera.bottom = -12;
    scene.add(dirLight);

    ambientLight = new THREE.AmbientLight(0xffffd4, 0.55);
    scene.add(ambientLight);

    // ========== 地板 ==========
    const floorBaseGeo = new THREE.BoxGeometry(12, 0.6, 9);
    const floorBaseMat = new THREE.MeshStandardMaterial({color:0xfff4e2, roughness:0.7});
    const floorBase = new THREE.Mesh(floorBaseGeo, floorBaseMat);
    floorBase.position.y = -0.3;
    floorBase.receiveShadow = true;
    scene.add(floorBase);

    const topGeo = new THREE.PlaneGeometry(11.4, 8.4);
    const topMat = new THREE.MeshStandardMaterial({color:0xfff4e2, roughness:0.72});
    const topMesh = new THREE.Mesh(topGeo, topMat);
    topMesh.rotation.x = -Math.PI / 2;
    topMesh.position.y = 0.001;
    topMesh.receiveShadow = true;
    scene.add(topMesh);
    floorMesh = topMesh;

    // ========== 后墙 ==========
    const wallMat = new THREE.MeshStandardMaterial({color:0xffffdf, roughness:0.85});
    const wallHeight = 4.4;
    const backWallGeo = new THREE.BoxGeometry(12, wallHeight, 0.35);
    const backWall = new THREE.Mesh(backWallGeo, wallMat);
    backWall.position.set(0, wallHeight / 2, -4.3);
    backWall.castShadow = true;
    backWall.receiveShadow = true;
    scene.add(backWall);

    const stripGeo = new THREE.BoxGeometry(12, 0.18, 0.4);
    const stripMat = new THREE.MeshStandardMaterial({color:0xffe5c2, roughness:0.9});
    const strip = new THREE.Mesh(stripGeo, stripMat);
    strip.position.set(0, 0.09, -4.08);
    scene.add(strip);

    // ========== 床 ==========
    const bedGroup = new THREE.Group();
    const bedFrameGeo = new THREE.BoxGeometry(2.6, 0.5, 1.4);
    const bedFrameMat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.35, metalness:0.15});
    const bedFrame = new THREE.Mesh(bedFrameGeo, bedFrameMat);
    bedFrame.position.y = 0.25;
    bedFrame.castShadow = true;
    bedGroup.add(bedFrame);

    const mattressGeo = new THREE.BoxGeometry(2.4, 0.22, 1.25);
    const mattressMat = new THREE.MeshStandardMaterial({color:0xff9ebb, roughness:0.5});
    const mattress = new THREE.Mesh(mattressGeo, mattressMat);
    mattress.position.y = 0.61;
    bedGroup.add(mattress);

    const quiltGeo = new THREE.BoxGeometry(2.3, 0.14, 1.12);
    const quiltMat = new THREE.MeshStandardMaterial({color:0xfffff7, roughness:0.55});
    const quilt = new THREE.Mesh(quiltGeo, quiltMat);
    quilt.position.y = 0.78;
    bedGroup.add(quilt);

    const pillowGeo = new THREE.BoxGeometry(0.7, 0.16, 0.42);
    const pillowMat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.4});
    const pillow = new THREE.Mesh(pillowGeo, pillowMat);
    pillow.position.set(-0.85, 0.9, -0.45);
    bedGroup.add(pillow);
    bedGroup.position.set(-1.5, 0, -2.0);
    scene.add(bedGroup);

    // ========== 书桌 ==========
    const deskGroup = new THREE.Group();
    const deskTopGeo = new THREE.BoxGeometry(1.9, 0.14, 0.8);
    const deskTopMat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.3, metalness:0.12});
    const deskTop = new THREE.Mesh(deskTopGeo, deskTopMat);
    deskTop.position.y = 0.82;
    deskTop.castShadow = true;
    deskGroup.add(deskTop);

    const legGeo = new THREE.BoxGeometry(0.12, 0.82, 0.12);
    const legMat = new THREE.MeshStandardMaterial({color:0x4aa8ff, roughness:0.4, metalness:0.25});
    const leg1 = new THREE.Mesh(legGeo, legMat); leg1.position.set(-0.89, 0.41, -0.34); deskGroup.add(leg1);
    const leg2 = new THREE.Mesh(legGeo, legMat); leg2.position.set(0.89, 0.41, -0.34); deskGroup.add(leg2);
    const leg3 = new THREE.Mesh(legGeo, legMat); leg3.position.set(-0.89, 0.41, 0.34); deskGroup.add(leg3);
    const leg4 = new THREE.Mesh(legGeo, legMat); leg4.position.set(0.89, 0.41, 0.34); deskGroup.add(leg4);

    const book1 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.07, 0.32), new THREE.MeshStandardMaterial({color:0xff5c5c, roughness:0.5}));
    book1.position.set(0.35, 0.91, 0.06);
    deskGroup.add(book1);
    const book2 = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.06, 0.26), new THREE.MeshStandardMaterial({color:0xffd24d, roughness:0.5}));
    book2.position.set(0.55, 0.97, -0.06);
    deskGroup.add(book2);

    // 椅子
    const chairGroup = new THREE.Group();
    const chairSeat = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.1, 0.48), new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.4}));
    chairSeat.position.y = 0.44;
    chairGroup.add(chairSeat);
    const chairBack = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.52, 0.08), new THREE.MeshStandardMaterial({color:0x4aa8ff, roughness:0.4}));
    chairBack.position.set(0, 0.68, -0.21);
    chairGroup.add(chairBack);
    chairGroup.position.set(0, 0, 0.85);
    deskGroup.add(chairGroup);
    deskGroup.position.set(2.4, 0, -1.6);
    scene.add(deskGroup);

    // ========== 吊扇 ==========
    const fanPoleGeo = new THREE.CylinderGeometry(0.08, 0.08, 1.2);
    const fanPoleMat = new THREE.MeshStandardMaterial({color:0x333333,roughness:0.4});
    const fanPole = new THREE.Mesh(fanPoleGeo, fanPoleMat);
    fanPole.position.set(-0.2, 2.7, 1.4);
    fanPole.castShadow = true;
    scene.add(fanPole);

    const fanHeadGeo = new THREE.CylinderGeometry(0.22,0.22,0.22,16);
    const fanHeadMat = new THREE.MeshStandardMaterial({color:0x222222});
    const fanHead = new THREE.Mesh(fanHeadGeo, fanHeadMat);
    fanHead.position.set(-0.2, 3.3, 1.4);
    fanHead.castShadow = true;
    scene.add(fanHead);

    const fanBladesGroup = new THREE.Group();
    const bladeMat = new THREE.MeshStandardMaterial({color:0xffdd33, roughness:0.45});
    for (let i = 0; i < 4; i++) {

        fanBladesGroup.add(blade);

    scene.add(fanBladesGroup);
    fanMesh = fanBladesGroup;

    // ========== 窗户 ==========
    const winFrameGeo = new THREE.BoxGeometry(2.9, 2.4, 0.45);
    const winFrameMat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.25, metalness:0.25});
    const winFrame = new THREE.Mesh(winFrameGeo, winFrameMat);
    winFrame.position.set(2.3, 1.9, -3.72);
    winFrame.castShadow = true;
    winFrame.receiveShadow = true;
    scene.add(winFrame);

    const winGlassGeo = new THREE.PlaneGeometry(2.25, 1.8);
    const winMat = new THREE.MeshStandardMaterial({color:0x55b1ff, side:THREE.DoubleSide, transparent:true, opacity:0.92, roughness:0.05, metalness:0.55, emissive:0x13355, emissiveIntensity:0.35});
    windowMesh = new THREE.Mesh(winGlassGeo, winMat);
    windowMesh.position.set(2.3, 1.9, -3.48);
    scene.add(windowMesh);

    // 白色十字窗格
    const crossMat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.25});
    const crossV = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.8, 0.05), crossMat);
    crossV.position.set(2.3, 1.9, -3.46);
    scene.add(crossV);
    const crossH = new THREE.Mesh(new THREE.BoxGeometry(2.25, 0.1, 0.05), crossMat);
    crossH.position.set(2.3, 1.9, -3.46);
    scene.add(crossH);

    // 窗台
    const sillGeo = new THREE.BoxGeometry(3.1, 0.18, 0.65);
    const sillMat = new THREE.MeshStandardMaterial({color:0xffffd4, roughness:0.35});
    const sill = new THREE.Mesh(sillGeo, sillMat);
    sill.position.set(2.3, 0.79, -3.62);
    sill.castShadow = true;
    scene.add(sill);

    // ========== 新增：除湿机模型（房间左下角） ==========
    const dehumidGeo = new THREE.BoxGeometry(1.0, 1.2, 0.55);
    const dehumidMat = new THREE.MeshStandardMaterial({color:0x888888, roughness:0.6, emissive:0x000000, emissiveIntensity:0});
    dehumidifierMesh = new THREE.Mesh(dehumidGeo, dehumidMat);
    dehumidifierMesh.position.set(-4.2,0.6,-2.2);
    dehumidifierMesh.castShadow = true;
    scene.add(dehumidifierMesh);

    animate();
}

// 除湿机视觉更新
function updateDehumidVisual(isOn){
    if(isOn){
        dehumidifierMesh.material.color.setHex(0x44aaff);
        dehumidifierMesh.material.emissive.setHex(0x0077ff);
        dehumidifierMesh.material.emissiveIntensity = 0.6;
    }else{
        dehumidifierMesh.material.color.setHex(0x888888);
        dehumidifierMesh.material.emissive.setHex(0x000000);
        dehumidifierMesh.material.emissiveIntensity = 0;
    }
}

// 模式灯光控制
function updateLightByMode(mode){
    if(mode === "study"){
        ambientLight.intensity = 0.55;
        ambientLight.color.setHex(0xffffd4);
    }else if(mode === "sleep"){
        ambientLight.intensity = 0.22;
        ambientLight.color.setHex(0xffddaa);
    }else if(mode === "away"){
        ambientLight.intensity = 0.05;
        ambientLight.color.setHex(0x222222);
    }
}

function animate() {
    requestAnimationFrame(animate);
    fanMesh.rotation.y += fanRotateSpeed;
    renderer.render(scene, camera);
}

// 增加max/min参数，更新全部面板，包含极值
function updateScene(nodeId, status, t, h, maxT, minT, maxH, minH) {
    // 更新顶部文字
    document.getElementById("dormName").innerText = nodeId.toUpperCase();
    document.getElementById("dormStatus").innerText = status;
    document.getElementById("tempVal").innerText = t;
    document.getElementById("humVal").innerText = h;

    // 最高最低温湿度，为空就显示--
    document.getElementById("maxTemp").innerText = (maxT!==null) ? maxT : "--";
    document.getElementById("minTemp").innerText = (minT!==null) ? minT : "--";
    document.getElementById("maxHum").innerText = (maxH!==null) ? maxH : "--";
    document.getElementById("minHum").innerText = (minH!==null) ? minH : "--";

    const d = dormStatusData[nodeId];
    document.getElementById("dehumidVal").innerText = d.dehumidifier ? "开启 ✅" : "关闭 ❌";

    let comfortText = "";
    if(status === "正常"){
        comfortText = "环境正常";
        document.getElementById("warnBox").style.display="none";
    }else{
        comfortText = "环境异常 ⚠️";
        document.getElementById("warnBox").style.display="block";
    }
    document.getElementById("comfortVal").innerText = comfortText;

    // 3D场景颜色同步（和A2面板MQTT消息对齐）
    if (status === "正常") {
        floorMesh.material.color.set(0xfff4e2);
        windowMesh.material.color.set(0x55b1ff);
        windowMesh.material.emissiveIntensity = 0.35;
    } else {
        // 所有异常状态统一地板变红（温度过高/湿度过高都触发）
        floorMesh.material.color.set(0xff3333);
        windowMesh.material.color.set(0xff7777);
        windowMesh.material.emissiveIntensity = 0.6;
    }
    updateDehumidVisual(d.dehumidifier);
    updateLightByMode(d.mode);
}

function updateDormData(nodeId, status, temp, hum){
    const d = dormStatusData[nodeId];
    if(!d) return;
    d.temp = temp;
    d.hum = hum;
    d.status = status;

    // ✅ 核心：自动更新极值（每个宿舍独立记录）
    if(d.maxTemp === null || temp > d.maxTemp) d.maxTemp = temp;
    if(d.minTemp === null || temp < d.minTemp) d.minTemp = temp;
    if(d.maxHum === null || hum > d.maxHum) d.maxHum = hum;
    if(d.minHum === null || hum < d.minHum) d.minHum = hum;

    // 判断是否异常
    if(status !== "正常"){
        d.isAbnormal = true;
        d.errCount +=1;
        // 如果没有定时器，开启定时器，每秒+1
        if(!d.timer){
            d.timer = setInterval(()=>{
                d.continuousErrTime +=1;
                calcPriorityDorm();
            },1000);
        }
        // A4：记录异常事件
        addEvent(nodeId, "异常", "环境连续异常");
    }else{
        // 恢复正常：停止计时，清零连续异常时长
        if(d.isAbnormal){
            // A4：记录恢复事件（只有从异常→正常才记录）
            addEvent(nodeId, "状态变更", "环境恢复正常", "", "", "已恢复正常");
        }
        d.isAbnormal = false;
        d.continuousErrTime = 0;
        if(d.timer){
            clearInterval(d.timer);
            d.timer = null;
        }
    }
    calcPriorityDorm();
}

//A1优先级计算
function calcPriorityDorm(){
    const arr = Object.entries(dormStatusData);
    const abnormalList = arr.filter(item=>item[1].isAbnormal);
    let result;
    if(abnormalList.length === 0){
        result = {name:"无", reason:"全部宿舍环境正常"};
    }else{
        abnormalList.sort((a,b)=>{
            const d1 = a[1],d2 = b[1];
            if(d2.continuousErrTime !== d1.continuousErrTime) return d2.continuousErrTime - d1.continuousErrTime;
            if(d2.errCount !== d1.errCount) return d2.errCount - d1.errCount;
            return a[0].localeCompare(b[0]);
        });
        const top = abnormalList[0];
        result = {name: top[0].toUpperCase(), reason:`连续异常时长:${top[1].continuousErrTime}秒，异常次数:${top[1].errCount}`};
        // A4：记录优先关注事件
        addEvent(top[0], "优先关注", "系统判定优先处理", result.reason);
    }
    document.getElementById("priorityText").innerText = `优先关注宿舍：${result.name}，${result.reason}`;
}

// MQTT客户端
const client = mqtt.connect('ws://127.0.0.1:8083/mqtt');
client.on('connect', () => {
    document.getElementById("mqttState").innerText = "✅已连接";
    console.log("MQTT连接成功");
    client.subscribe('dormmate/+/env');
    client.subscribe('dormmate/control');
    client.subscribe('dormmate/mode');
});
client.on('message', function(topic, payload) {
    try {
        let msg = JSON.parse(payload.toString());
        // 环境传感器数据
        if(topic.endsWith("/env")){
            updateDormData(msg.nodeId, msg.status, msg.temp, msg.hum);
            if(msg.nodeId === currentViewDorm){
                const d = dormStatusData[msg.nodeId];
                updateScene(msg.nodeId, msg.status, msg.temp, msg.hum, d.maxTemp, d.minTemp, d.maxHum, d.minHum);
            }
        }
        // 接收A2页面设备控制指令（风扇/灯/除湿）
        if(topic === "dormmate/control"){
            const cmd = msg;
            const dorm = dormStatusData[cmd.nodeId];
            let actionName = "";
            if(cmd.device === "fan"){
                dorm.fan = cmd.state;
                actionName = cmd.state ? "开启风扇并通风" : "关闭风扇";
                // ✅ 修改：只在当前查看的宿舍才更新风扇转速！
                if(currentViewDorm === cmd.nodeId){
                    fanRotateSpeed = dorm.fan ? 0.08 : 0;
                }
            }
            if(cmd.device === "light"){
                dorm.light = cmd.state;
                actionName = cmd.state ? "开启灯光" : "关闭灯光";
            }
            if(cmd.device === "dehumidifier"){
                dorm.dehumidifier = cmd.state;
                actionName = cmd.state ? "开启除湿机" : "关闭除湿机";
            }
            // A4：记录用户执行操作事件
            addEvent(cmd.nodeId, "执行操作", "用户下发设备控制", "", actionName);

            // 如果当前查看的宿舍正好是被控制的宿舍，刷新画面
            if(currentViewDorm === cmd.nodeId){
                const d = dormStatusData[currentViewDorm];
                updateScene(currentViewDorm, d.status, d.temp, d.hum, d.maxTemp, d.minTemp, d.maxHum, d.minHum);
            }
        }
        // 接收模式切换消息
        if(topic === "dormmate/mode"){
            const cmd = msg;
            const dorm = dormStatusData[cmd.nodeId];
            dorm.mode = cmd.mode;
            if(currentViewDorm === cmd.nodeId){
                updateLightByMode(dorm.mode);
            }
        }
    } catch (e) {
        console.error("解析消息失败：", e);
    }
});
client.on('close',()=>{
    document.getElementById("mqttState").innerText = "❌断开";
});

// 页面加载完成后，先绑定按钮，再初始化3D
window.onload = function(){
    bindDormButtons();
    init3DScene();
}
</script>
